name: CRM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      CRM_BASIC_USER: ci-user
      CRM_BASIC_PASSWORD: ci-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Prepare test database
        run: npm run db:push

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Biome check
        run: npm run check

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build
